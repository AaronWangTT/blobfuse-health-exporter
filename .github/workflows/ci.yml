name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: Go validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.7
          cache: true

      - name: Verify module files
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Check shell syntax
        run: bash -n test/integration/*.sh test/performance/*.sh test/tools/*.sh

      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Build Linux executable
        run: go build -trimpath -o "${RUNNER_TEMP}/blobfuse-health-exporter" .

  external-integration:
    name: Collector and Prometheus integration
    needs: go-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.7
          cache: true

      - name: Install checksum-pinned tools
        run: bash test/tools/install-observability-tools.sh "${RUNNER_TEMP}/bin" all

      - name: Validate integration configuration
        env:
          OTELCOL_HTTP_ENDPOINT: 127.0.0.1:14318
          PROMETHEUS_OTLP_ENDPOINT: http://127.0.0.1:19090/api/v1/otlp/v1/metrics
        run: |
          "${RUNNER_TEMP}/bin/otelcol" validate --config=file:test/integration/otelcol.yaml
          "${RUNNER_TEMP}/bin/otelcol" validate --config=file:test/integration/otelcol-prometheus.yaml
          "${RUNNER_TEMP}/bin/promtool" check config test/integration/prometheus-otlp.yaml

      - name: Run Collector smoke test
        env:
          GO_BIN: go
          OTELCOL_BIN: ${{ runner.temp }}/bin/otelcol
        run: bash test/integration/collector-smoke.sh

      - name: Run Prometheus smoke test
        env:
          GO_BIN: go
          PROMETHEUS_BIN: ${{ runner.temp }}/bin/prometheus
        run: bash test/integration/prometheus-smoke.sh

  real-mount-integration:
    name: Azurite real-mount integration
    needs: go-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Azure Storage Fuse
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/azure-storage-fuse
          ref: fb058fda6460443bbe64d19e9e836f2913d282bb
          path: .e2e/azure-storage-fuse
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
          cache-dependency-path: |
            go.sum
            .e2e/azure-storage-fuse/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.1

      - name: Install FUSE dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes fuse3 libfuse3-dev pkg-config
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          pkg-config --modversion fuse3
          fusermount3 -V

      - name: Install pinned Azurite
        shell: bash
        run: |
          set -euo pipefail
          command -v az
          npm install --global --prefix "${RUNNER_TEMP}/azurite" azurite@3.29.0
          "${RUNNER_TEMP}/azurite/bin/azurite-blob" --version

      - name: Install checksum-pinned observability tools
        run: bash test/tools/install-observability-tools.sh "${RUNNER_TEMP}/observability" all

      - name: Run Azurite real-mount integration
        env:
          BLOBFUSE2_REPO: ${{ github.workspace }}/.e2e/azure-storage-fuse
          GO_BIN: go
          BLOBFUSE_GO_BIN: go
          OTELCOL_BIN: ${{ runner.temp }}/observability/otelcol
          PROMETHEUS_BIN: ${{ runner.temp }}/observability/prometheus
          AZURITE_BIN: ${{ runner.temp }}/azurite/bin/azurite-blob
          AZ_BIN: az
          E2E_EVIDENCE_DIR: ${{ runner.temp }}/blobfuse-e2e-evidence
        run: bash test/integration/azurite-mount-e2e.sh

      - name: Upload metric evidence
        id: metric_evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blobfuse-real-mount-metrics
          path: ${{ runner.temp }}/blobfuse-e2e-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish metric summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.metric_evidence.outputs.artifact-url }}
          EVIDENCE_DIR: ${{ runner.temp }}/blobfuse-e2e-evidence
        run: |
          set -euo pipefail
          if [[ -f "${EVIDENCE_DIR}/summary.md" ]]; then
            cat "${EVIDENCE_DIR}/summary.md" >>"${GITHUB_STEP_SUMMARY}"
          else
            cat >>"${GITHUB_STEP_SUMMARY}" <<'MARKDOWN'
          # Azurite real-mount OTLP metrics

          Metric evidence was not generated. See the workflow job log for the failing setup step.
          MARKDOWN
          fi
          if [[ -n "${ARTIFACT_URL}" ]]; then
            printf '\n[Download sanitized metric evidence](%s)\n' \
              "${ARTIFACT_URL}" >>"${GITHUB_STEP_SUMMARY}"
          fi