name: blobfuse-observability

services:
  collector:
    image: otel/opentelemetry-collector:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      edge:
        aliases:
          - blobfuse-collector
      backend:
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-otlp-receiver
    restart: unless-stopped
    volumes:
      - ./prometheus-otlp.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/blobfuse-ci-runs.json
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY is required}
      GF_SERVER_DOMAIN: ${TELEMETRY_HOST:?TELEMETRY_HOST is required}
      GF_SERVER_ROOT_URL: https://${TELEMETRY_HOST:?TELEMETRY_HOST is required}/blobfuse-grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      edge:
        aliases:
          - blobfuse-grafana
      backend:
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: blobfuse-observability-edge
  backend:
    internal: true

volumes:
  grafana_data:
  prometheus_data: